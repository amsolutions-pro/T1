<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amsolutions-pro</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 420px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #60a5fa;
    }
    p {
      color: #94a3b8;
      margin-bottom: 3rem;
    }
    .card {
      background: #1e2937;
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      border: 1px solid #334155;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }
    button {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 0.8rem;
    }
    .btn-fasting {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    .btn-game {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>amsolutions</h1>
    <p>Choisissez votre application</p>

    <div class="card">
      <h2>⏱️ Compteur de Jeûne</h2>
      <p>Suivez vos jeûnes, phases, historique et progression.</p>
      <button class="btn-fasting" onclick="window.location.href='https://amsolutions-pro.github.io/T1/fasting/'">
        Accéder au compteur de jeûne
      </button>
    </div>

    <div class="card">
      <h2>🎮 Mémoire Trio</h2>
      <p>Jeu de mémoire à plusieurs joueurs (2 à 5). Parfait pour patienter.</p>
      <button class="btn-game" onclick="window.location.href='https://amsolutions-pro.github.io/T1/game/'">
        Jouer à Mémoire Trio
      </button>
    </div>

    <div class="footer">
      Made with ❤️ by amsolutions-pro
    </div>
  </div>
</body>
</html>
